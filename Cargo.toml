[package]
name = "zyphra-textnorm"
version.workspace = true
description = "Text normalization for TTS (written form to spoken form) in nine languages: hand-written Rust ports of the NeMo r1.2.0 grammars, no FST runtime"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tts", "text-normalization", "speech", "nemo"]
categories = ["text-processing", "internationalization"]
# The oracle, its corpus and goldens (≈ 15 MB) stay in the repository: the crate ships the library, its tables and
# the tests that need no golden.
include = [
    "/src/**",
    "/data/**",
    "/include/**",
    "/examples/**",
    "/benches/**",
    "/tests/wrapper.rs",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/licenses/**",
]

[workspace]
members = ["python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# let chains
rust-version = "1.88"
license = "MIT AND Apache-2.0"
repository = "https://github.com/Zyphra/zyphra-textnorm"

[lib]
name = "zyphra_textnorm"

[features]
# One feature per grammar package; a port is built and tested alone with `--no-default-features --features lang-<l>`.
default = ["lang-en", "lang-de", "lang-es", "lang-fr", "lang-it", "lang-pt", "lang-ja", "lang-zh", "lang-ko"]
lang-en = []
lang-de = []
lang-es = []
lang-fr = []
lang-it = []
lang-pt = []
lang-ja = []
lang-zh = []
lang-ko = []
# The C ABI (include/zyphra_textnorm.h). Build the static library with
# `cargo rustc --release --lib --features capi --crate-type staticlib`.
capi = []

[dependencies]

[dev-dependencies]
# The goldens are committed zstd-compressed (tests/golden/*.jsonl.zst); pure-Rust decoder.
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "normalize"
harness = false

# The differential tests read tests/golden/ (repository only).
[[test]]
name = "golden"
path = "tests/golden.rs"

[[test]]
name = "en_cardinal"
path = "tests/en_cardinal.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
# unwind, not abort: a grammar panic becomes a grammar failure (the sentence kept as typed). Under panic = "abort" it
# aborts the process instead.
panic = "unwind"

[profile.bench]
inherits = "release"
