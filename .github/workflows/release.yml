name: release

# The release: one abi3 wheel per platform (CPython >= 3.9) and the sdist, each wheel installed and run on its own
# platform. On a `v*` tag, once every build has passed, the crate goes to crates.io and then the wheels and the sdist go
# to PyPI, both by trusted publishing (README, "Release"). A dispatch on a branch only builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64 }
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
          - { runner: windows-latest, target: x64, python-arch: x64 }
          - { runner: windows-11-arm, target: aarch64, python-arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}
      # Linux wheels build in the manylinux2014 container (glibc 2.17).
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: --release --locked --out dist
      - name: Install and run the wheel
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist zyphra-textnorm
          python -c "import zyphra_textnorm as t; assert t.normalize('It costs \$5.', 'en') == 'It costs five dollars.'; assert t.Normalizer(['laugh']).normalize('a <laugh/> \$5', 'en') == 'a <laugh/> five dollars'; assert t.Normalizer(prepass=True).normalize('2 - 7 = -5', 'es') == 'dos menos siete es igual a menos cinco'"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  crates:
    needs: [wheel, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/zyphra-textnorm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "zyphra-textnorm") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $version"
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p zyphra-textnorm --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # After the crate, so a failed crates.io publish (version check, verification build) leaves PyPI untouched.
  pypi:
    needs: crates
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zyphra-textnorm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
